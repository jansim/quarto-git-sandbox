<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git sandbox: standalone embed</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_extensions/git-sandbox/resources/git-sandbox.css">
<style>
  body {
    font-family: "Open Sans", system-ui, sans-serif;
    color: #404041;
    background: #FFFFFF;
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    line-height: 1.6;
  }

  /* example-embed.html?record: a fixed frame for screen recordings. The box
     never changes height: every panel scrolls inside the same fixed area,
     and the done-note has room reserved (tune to the checklist's size). */
  .record body { max-width: 980px; padding: 24px; }
  .record .gs-panel:not([hidden]) { height: 380px; overflow-y: auto; }
  .record .gs-diff, .record .gs-graph-scroll { max-height: none; }
  .record .gs-tasks:not(:empty) { min-height: 230px; }
</style>
<script>
  if (/[?&]record\b/.test(location.search)) document.documentElement.classList.add('record');
</script>
</head>
<body>

<!--
  The same widget outside Quarto: copy the files in
  _extensions/git-sandbox/resources/ next to your page, load them in this
  order, and add a container div plus a mount call. Useful if your platform
  will take an iframe or a raw HTML block but not a full Quarto document.

  This is the same "A tour of the git box" exercise that opens example.qmd.
  The `when:` language works here too, and `seed` can be the same block of
  commands; task text is HTML instead of Markdown, and option names are
  camelCase.
-->

<div class="git-sandbox" id="anatomy">
  <div class="gs-loading">Loading the Git sandbox…</div>
</div>

<script src="_extensions/git-sandbox/resources/isomorphic-git.bundle.js"></script>
<script src="_extensions/git-sandbox/resources/sandbox-core.js"></script>
<script src="_extensions/git-sandbox/resources/sandbox-when.js"></script>
<script src="_extensions/git-sandbox/resources/sandbox-tree.js"></script>
<script src="_extensions/git-sandbox/resources/sandbox-ui.js"></script>
<script>
GitSandboxUI.mount('#anatomy', {
  title: 'A tour of the git box',
  prompt: '~/demo-project $',
  intro: [
    'This repository already has two commits. Run a few commands and watch',
    'the panels below; every one of them updates after each command.',
    'Type {y}help{/} to see what the sandbox supports.'
  ],
  hints: ['git status', 'git log --oneline', 'echo "A new line." >> README.md', 'git diff', 'git add .', 'git commit -m "Extend the README"'],
  doneNote: 'That is the whole feedback loop. Every command updates every panel. Your lessons ride on top of it.',
  seed: [
    'git init',
    'echo "# Demo project" > README.md',
    'git add .',
    'git commit -m "Add the README"',
    'echo "library(tidyverse)" > analysis.R',
    'git add .',
    'git commit -m "Start the analysis"'
  ].join('\n'),
  tasks: [
    { text: 'Ask where things stand with <code>git status</code>',
      when: 'ran /^\\s*git\\s+status/' },
    { text: 'Change a file and find it in the Changes panel',
      when: 'not clean' },
    { text: 'Stage it and watch it move to the staging area in the diagram',
      when: 'staged' },
    { text: 'Commit it and watch the history graph grow',
      when: 'commits >= 3' }
  ]
});
</script>

</body>
</html>
