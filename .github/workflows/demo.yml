# Publishes example.qmd to GitHub Pages as a live demo, so people can try the
# exercises before installing anything.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never cancel one that is already running:
# cancelling mid-deployment can leave the Pages deployment stuck in "queued",
# which then blocks every later run. This matches GitHub's own Pages template.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      # The guide is the site's front page and is also published under its
      # own name, which is what the reveal.js deck links back to.
      - name: Render the demo
        run: |
          quarto render example.qmd
          quarto render example-revealjs.qmd

      - uses: actions/configure-pages@v5

      - name: Collect the site
        run: |
          mkdir -p _site
          cp example.html _site/index.html
          mv example.html example-revealjs.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
