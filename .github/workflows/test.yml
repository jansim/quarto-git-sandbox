name: test

on:
  push:
    branches: ['**']
  pull_request:

# A push to a branch with an open PR triggers both a push and a pull_request
# run for the same commit. Both land in the same group (keyed by source repo
# and branch), so the later one cancels the other. This also cancels stale
# runs when new commits are pushed. The repo is part of the key so a fork's
# PR from a same-named branch doesn't cancel runs here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      - run: npm install

      # The committed bundle must match src/. If this leaves the tree dirty,
      # someone edited resources/git-sandbox.js by hand or forgot to rebuild.
      - name: Check the generated bundle is up to date
        run: |
          ./build.sh
          git diff --exit-code -- _extensions/git-sandbox/resources/git-sandbox.js

      - run: ./tests/run.sh
