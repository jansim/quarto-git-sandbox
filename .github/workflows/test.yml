name: test

# Branch pushes are tested through their pull request, so each commit runs
# once. Running both for the same commit used to cancel one of the two, which
# GitHub shows as a failed check. A branch without a PR can be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run for the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      - run: npm install

      - run: ./tests/run.sh
